<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0914"><meta name="description" content="MANGA WORLD — โลกแห่งมังงะต้นฉบับ อ่านมังงะแฟนตาซีออนไลน์"><title>MANGA WORLD | โลกแห่งมังงะ</title>
<style>
:root{color-scheme:dark;--bg:#0b0914;--surface:#191525;--line:#4b3c50;--gold:#e1bc79;--gold2:#a87a42;--text:#faf4e9;--muted:#b8adc1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;background:radial-gradient(ellipse 90% 450px at 50% 0%,#30213e 0%,transparent 82%),var(--bg);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:#100d1bec;backdrop-filter:blur(18px);border-bottom:1px solid #6b523e77;box-shadow:0 12px 32px #0005}header .inner{max-width:1190px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px}.logo{color:#f1d69f;font:900 clamp(19px,3vw,26px) Georgia,serif;letter-spacing:1.7px;white-space:nowrap;text-shadow:0 0 20px #dfbb7644}.logo:before{content:'✦';font-size:.75em;margin-right:9px}header nav{display:flex;gap:8px}button,.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:750;background:linear-gradient(115deg,#f3dca5,#c69752);color:#21150f;transition:transform .2s,box-shadow .2s,border-color .2s}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 9px 22px #0007}.secondary{background:#2c243a;color:#f6ebd8;border:1px solid #6a5268}.ghost{background:transparent;color:#f3d8a4;border:1px solid #98774c}
main{max-width:1150px;margin:auto;padding:26px 18px 75px}.hero{position:relative;isolation:isolate;overflow:hidden;min-height:335px;border:1px solid #a4835366;border-radius:24px;padding:clamp(30px,6vw,70px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 82% 40%,#78496b99,transparent 36%),linear-gradient(115deg,#1a1324,#29213d 65%,#120f1c);box-shadow:0 22px 65px #0008,inset 0 0 65px #d9a95613;margin-bottom:36px}.hero:before{content:'ORIGINAL MANGA COLLECTION';font-size:11px;font-weight:850;letter-spacing:3px;color:var(--gold);margin-bottom:17px}.hero:after{content:'✧';position:absolute;right:7%;top:1%;font:300 clamp(160px,27vw,330px) Georgia,serif;color:#f1d18b1b;z-index:-1}.hero h1{font:800 clamp(31px,5vw,51px)/1.25 Georgia,'Noto Serif Thai',serif;margin:0 0 14px;max-width:710px;text-shadow:0 4px 25px #0008}.hero p{max-width:550px;line-height:1.85;color:#ddd1e2;margin:0 0 22px}.hero button{padding:13px 26px}h2{font:750 clamp(23px,3vw,30px) Georgia,'Noto Serif Thai',serif;margin:0 0 19px}.section-heading:before{content:'✦';color:var(--gold);margin-right:11px}.muted,small{color:var(--muted)}.search{width:100%;padding:16px 18px;background:#181322;color:white;border:1px solid #66506a;border-radius:13px;margin:0 0 24px;box-shadow:inset 0 1px 12px #0004}.search:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:22px}.card{padding:0;text-align:left;background:#1b1625;border:1px solid #4b3a50;color:white;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px #0005;transition:transform .22s,border-color .22s,box-shadow .22s}.card:hover{transform:translateY(-6px)!important;border-color:var(--gold);box-shadow:0 17px 38px #0009}.cover{aspect-ratio:3/4;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 58% 25%,#85546e80,transparent 47%),linear-gradient(145deg,#54334d,#171a34);font-size:82px;overflow:hidden}.cover.alt{background:radial-gradient(circle at 55% 22%,#5b8b9777,transparent 48%),linear-gradient(140deg,#263e4d,#26182f)}.cover:after{content:'';position:absolute;inset:9px;border:1px solid #e9c88b55;pointer-events:none}.cover span{position:absolute;bottom:15px;left:14px;z-index:1;font-size:12px;background:#0b0914d9;color:#ead1a4;border:1px solid #bda07455;padding:5px 9px;border-radius:7px}.card-info{padding:15px}.card-info b{display:block;margin-bottom:6px;font-size:16px;line-height:1.5}.card-info small{line-height:1.6}.back{margin-bottom:22px}.detail{display:grid;grid-template-columns:minmax(130px,240px) 1fr;gap:26px;align-items:start}.detail .cover{border-radius:16px;box-shadow:0 16px 40px #0008}.detail h1{font:800 clamp(23px,3vw,38px) Georgia,'Noto Serif Thai',serif;color:#f2d5a0;margin:0 0 12px}.detail p{line-height:1.8}.chapters{margin-top:35px}.chapter{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;padding:17px 19px;margin:10px 0;border:1px solid #534157;border-radius:12px;background:#1c1728;color:var(--text)}.chapter:hover{border-color:var(--gold);background:#2b2137}.reader-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.reader-head h1{font-size:clamp(18px,3vw,24px);margin:0}.reader-controls{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.reader-controls button{flex:1;min-width:130px}.reader-controls button.active{background:linear-gradient(115deg,#f3dca5,#c69752);color:#21150f}.reader-controls button:not(.active){background:#292239;color:#f5e8d8}.page-art{background:white;color:#16141c;max-width:720px;margin:12px auto;min-height:420px;aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:3px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-shadow:0 8px 24px #0007}.page-art .top{font-size:clamp(18px,4vw,31px);font-weight:900;border-bottom:5px solid #17141c;padding-bottom:10px}.page-art .scene{flex:1;margin:16px 0;border:5px solid #171720;background:repeating-linear-gradient(130deg,#f3f3f3,#f3f3f3 12px,#e7e7e7 13px,#e7e7e7 15px);display:grid;place-items:center;position:relative}.scene .symbol{font-size:clamp(75px,23vw,155px);filter:grayscale(1)}.bubble{background:white;border:3px solid #111;border-radius:50%;padding:12px 18px;text-align:center;max-width:85%;font-size:clamp(14px,3vw,20px);font-weight:700}.page-art .bottom{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.page-nav{display:flex;gap:10px;justify-content:center;margin:18px auto;max-width:720px}.page-nav button{flex:1}.notice{background:#272032;border-left:3px solid var(--gold);padding:13px;border-radius:6px;margin:15px 0}.ad{border:1px dashed #65546d;border-radius:12px;color:var(--muted);text-align:center;padding:23px;margin:35px 0;background:#15111d}.empty{padding:28px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:30px 16px;border-top:1px solid #43364b;background:#0a0811}
@media(max-width:600px){header .inner{padding:12px}.logo{letter-spacing:.3px}.logo:before{margin-right:4px}header nav{gap:5px}header nav button{padding:8px;font-size:12px}main{padding:18px 12px 55px}.hero{min-height:280px;padding:28px 22px;margin-bottom:29px}.hero:after{right:-7%;top:19%;font-size:180px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{font-size:67px}.card-info{padding:11px}.detail{grid-template-columns:120px 1fr;gap:14px}.page-art{padding:13px;min-height:350px}.page-art .scene{margin:12px 0}.page-art .bottom{font-size:10px}}@media(max-width:360px){.logo{font-size:16px}header nav button{font-size:11px;padding:7px}.detail{grid-template-columns:100px 1fr}}
</style></head><body><header><div class="inner"><div class="logo">MANGA WORLD</div><nav><button class="secondary" onclick="goHome()">หน้าแรก</button><button class="secondary" onclick="goHome(true)">มังงะทั้งหมด</button></nav></div></header><main id="app"></main><footer>© 2026 MANGA WORLD · มังงะต้นฉบับและระบบอ่านฉบับสาธิต</footer>
<script>
'use strict';
// เพิ่มเรื่องและตอนใหม่ในรายการนี้ได้ในอนาคต
const books=[{id:'nameless',title:'ราชันไร้นาม',genre:'แฟนตาซี · การเมือง',icon:'👑',desc:'มหากาพย์แฟนตาซีของราชันผู้วางหมากจากเงามืด (เนื้อหาตัวอย่างเพื่อทดสอบระบบอ่าน)',chapters:[{name:'ตอนที่ 1 — จุดเริ่มต้น',pages:['ประตูสู่โลกใบใหม่','เงาของราชัน','หมากตัวแรก','เรื่องราวกำลังจะเริ่มต้น']},{name:'ตอนที่ 2 — เส้นทางแห่งราชัน',pages:['การเดินทาง','พันธมิตรใหม่','ความลับที่ถูกซ่อน','โปรดติดตามตอนต่อไป']}]},{id:'new',title:'มังงะเรื่องใหม่',genre:'แอ็กชัน · ผจญภัย',icon:'⚔️',desc:'พื้นที่สำหรับมังงะต้นฉบับเรื่องต่อไป',chapters:[]}];
let current={view:'home',book:null,chapter:0,page:0,mode:localStorage.getItem('mw_mode')||'scroll'};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cover(b){return `<div class="cover ${b.id==='new'?'alt':''}">${b.icon}<span>${b.chapters.length?'มีตอนสาธิต':'เร็ว ๆ นี้'}</span></div>`}function goHome(focus=false){current.view='home';render();if(focus)document.getElementById('library')?.scrollIntoView({behavior:'smooth'});else window.scrollTo(0,0)}function openBook(id){current.book=books.find(b=>b.id===id);current.view='detail';render();window.scrollTo(0,0)}function openChapter(i){if(!current.book?.chapters[i])return;current.chapter=i;current.page=0;try{let saved=JSON.parse(localStorage.getItem('mw_progress_'+current.book.id+'_'+i)||'null');if(saved&&Number.isInteger(saved.page))current.page=Math.max(0,Math.min(saved.page,current.book.chapters[i].pages.length-1))}catch(e){}current.view='reader';render();window.scrollTo(0,0)}function setMode(mode){current.mode=mode;localStorage.setItem('mw_mode',mode);render()}function saveProgress(){localStorage.setItem('mw_progress_'+current.book.id+'_'+current.chapter,JSON.stringify({page:current.page}))}function movePage(delta){let n=current.book.chapters[current.chapter].pages.length;current.page=Math.max(0,Math.min(n-1,current.page+delta));saveProgress();render();document.getElementById('art')?.scrollIntoView({behavior:'smooth',block:'start'})}function pageMarkup(label,i,n){return `<article class="page-art" aria-label="หน้าที่ ${i+1}"><div class="top">${esc(current.book.title)}</div><div class="scene"><span class="symbol">${current.book.icon}</span><div class="bubble">${esc(label)}</div></div><div class="bottom"><span>ภาพสาธิต — ยังไม่ใช่ภาพมังงะจริง</span><span>${i+1} / ${n}</span></div></article>`}function render(){if(current.view==='home'){app.innerHTML=`<section class="hero"><h1>เปิดประตูสู่โลกมังงะ</h1><p>ดื่มด่ำกับเรื่องราวแฟนตาซี การผจญภัย และตำนานเหนือจินตนาการ ในโลกแห่งมังงะต้นฉบับ</p><button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">สำรวจมังงะ ✦</button></section><section id="library"><h2 class="section-heading">มังงะทั้งหมด</h2><input class="search" id="search" placeholder="⌕  ค้นหาชื่อมังงะ..." aria-label="ค้นหามังงะ" oninput="filterBooks(this.value)"><div class="grid" id="bookGrid">${books.map(b=>`<button class="card" data-search="${esc((b.title+' '+b.genre).toLowerCase())}" onclick="openBook('${b.id}')">${cover(b)}<div class="card-info"><b>${esc(b.title)}</b><small>${esc(b.genre)}</small></div></button>`).join('')}</div><p class="empty hide" id="noBooks">ไม่พบมังงะที่ค้นหา</p></section><div class="ad">พื้นที่สำหรับโฆษณาในอนาคต — ยังไม่มีโฆษณาจริง</div><p class="muted">หมายเหตุ: เนื้อหาและภาพในเว็บตอนนี้เป็นตัวอย่างสำหรับทดสอบระบบ</p>`;return}let b=current.book;if(current.view==='detail'){app.innerHTML=`<button class="ghost back" onclick="goHome()">← กลับหน้าแรก</button><section class="detail">${cover(b)}<div><h1>${esc(b.title)}</h1><p class="muted">${esc(b.genre)}</p><p>${esc(b.desc)}</p><p>${b.chapters.length} ตอน</p>${b.chapters.length?'<button onclick="openChapter(0)">เริ่มอ่านตอนที่ 1</button>':''}</div></section><section class="chapters"><h2 class="section-heading">รายชื่อตอน</h2>${b.chapters.length?b.chapters.map((c,i)=>`<button class="chapter" onclick="openChapter(${i})"><span>${esc(c.name)}</span><span>อ่าน ›</span></button>`).join(''):'<p class="notice">เรื่องนี้ยังไม่มีตอนให้อ่าน</p>'}</section>`;return}let c=b.chapters[current.chapter],n=c.pages.length;app.innerHTML=`<button class="ghost back" onclick="openBook('${b.id}')">← กลับรายชื่อตอน</button><div class="reader-head"><h1>${esc(b.title)} · ${esc(c.name)}</h1><span class="muted">${n} หน้า</span></div><div class="notice">ภาพในตอนนี้เป็นหน้าตัวอย่างเพื่อทดสอบระบบอ่าน ยังไม่ใช่มังงะที่วาดเสร็จแล้ว</div><div class="reader-controls"><button class="${current.mode==='scroll'?'active':''}" onclick="setMode('scroll')">↕ เลื่อนอ่าน</button><button class="${current.mode==='page'?'active':''}" onclick="setMode('page')">⇦ เปลี่ยนหน้า (ขวาไปซ้าย)</button></div><div id="art">${current.mode==='scroll'?c.pages.map((p,i)=>pageMarkup(p,i,n)).join(''):pageMarkup(c.pages[current.page],current.page,n)}</div>${current.mode==='page'?`<div class="page-nav"><button class="secondary" onclick="movePage(-1)" ${current.page===0?'disabled':''}>หน้าก่อนหน้า →</button><button onclick="movePage(1)" ${current.page===n-1?'disabled':''}>← หน้าถัดไป</button></div><p class="muted" style="text-align:center">หน้า ${current.page+1} จาก ${n} · จำหน้าที่อ่านค้างไว้ในเครื่องนี้</p>`:''}<div class="page-nav"><button class="secondary" onclick="openBook('${b.id}')">รายชื่อตอน</button><button onclick="nextChapter()" ${current.chapter+1>=b.chapters.length?'disabled':''}>ตอนถัดไป →</button></div>`}function filterBooks(q){let count=0;document.querySelectorAll('.card').forEach(el=>{let ok=el.dataset.search.includes(q.trim().toLowerCase());el.classList.toggle('hide',!ok);if(ok)count++});document.getElementById('noBooks').classList.toggle('hide',count!==0)}function nextChapter(){if(current.chapter+1<current.book.chapters.length)openChapter(current.chapter+1)}render();
</script></body></html>
