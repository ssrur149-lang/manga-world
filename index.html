<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11111b"><title>MANGA WORLD | อ่านมังงะ</title><style>
:root{color-scheme:dark;--bg:#101018;--surface:#1c1c29;--line:#383849;--text:#f6f4f8;--muted:#b6b1c2;--pink:#ff4c80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:#171722ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px max(16px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;color:var(--pink);font-size:21px;letter-spacing:.3px}header nav{display:flex;gap:8px}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--pink);color:#161018;font-weight:700}.secondary{background:#303040;color:white}.ghost{background:transparent;color:white;border:1px solid var(--line)}main{max-width:1050px;margin:auto;padding:20px 16px 70px}.hero{background:linear-gradient(120deg,#542b4b,#17172b 75%);border:1px solid #57314f;border-radius:20px;padding:32px 23px;margin:10px 0 30px}.hero h1{font-size:clamp(28px,6vw,45px);margin:0 0 8px}.hero p{color:#e1d7e1}.search{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:white;margin:10px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;text-align:left;color:white;padding:0}.cover{aspect-ratio:3/4;display:grid;place-items:center;background:linear-gradient(140deg,#603252,#202b4a);font-size:80px;position:relative}.cover.alt{background:linear-gradient(135deg,#254e64,#302344)}.cover span{position:absolute;bottom:12px;left:12px;font-size:12px;background:#101018bb;border-radius:6px;padding:5px 8px}.card-info{padding:13px}.card-info b{display:block;margin-bottom:6px}.muted,small{color:var(--muted)}.hide{display:none!important}.back{margin-bottom:20px}.detail{display:grid;grid-template-columns:minmax(110px,220px) 1fr;gap:20px}.detail .cover{border-radius:15px;overflow:hidden}.detail h1{margin:0 0 10px}.chapters{margin-top:30px}.chapter{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);color:white;border-radius:12px;padding:16px;margin:10px 0}.reader-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.reader-head h1{font-size:20px}.reader-controls{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.reader-controls button{flex:1;min-width:105px}.reader-controls button.active{background:var(--pink);color:#161018}.reader-controls button:not(.active){background:#292938;color:white}.page-art{background:#fff;color:#14141c;max-width:720px;margin:12px auto;min-height:420px;aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:3px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-shadow:0 8px 24px #0005}.page-art .top{font-weight:900;font-size:clamp(18px,4vw,31px);border-bottom:5px solid #14141c;padding-bottom:10px}.page-art .scene{flex:1;margin:16px 0;border:5px solid #171720;background:repeating-linear-gradient(130deg,#f3f3f3,#f3f3f3 12px,#e7e7e7 13px,#e7e7e7 15px);display:grid;place-items:center;position:relative}.scene .symbol{font-size:clamp(75px,23vw,155px);filter:grayscale(1)}.bubble{background:white;border:3px solid #111;border-radius:50%;padding:12px 18px;text-align:center;max-width:85%;font-size:clamp(14px,3vw,20px);font-weight:700}.page-art .bottom{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.page-nav{display:flex;gap:10px;justify-content:center;margin:18px auto;max-width:720px}.page-nav button{flex:1}.ad{border:1px dashed #676173;border-radius:12px;color:var(--muted);text-align:center;padding:23px;margin:30px 0}footer{text-align:center;color:var(--muted);padding:30px}.notice{background:#252333;border-left:3px solid var(--pink);padding:12px;border-radius:6px;margin:14px 0}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:500px){.detail{grid-template-columns:120px 1fr}.detail h1{font-size:21px}.hero{padding:25px 18px}.logo{font-size:18px}header nav button{padding:9px;font-size:13px}.page-art{padding:13px;min-height:350px}.page-art .scene{margin:12px 0}}
</style></head><body><header><div class="logo">MANGA WORLD</div><nav><button class="secondary" onclick="goHome()">หน้าแรก</button><button class="secondary" onclick="goHome(true)">มังงะทั้งหมด</button></nav></header><main id="app"></main><footer>© 2026 MANGA WORLD · มังงะต้นฉบับและระบบอ่านฉบับสาธิต</footer><script>
'use strict';
// เพิ่มเรื่องและตอนใหม่ในรายการนี้ได้ในอนาคต
const books=[{id:'nameless',title:'ราชันไร้นาม',genre:'แฟนตาซี · การเมือง',icon:'👑',desc:'มหากาพย์แฟนตาซีของราชันผู้วางหมากจากเงามืด (เนื้อหาตัวอย่างเพื่อทดสอบระบบอ่าน)',chapters:[{name:'ตอนที่ 1 — จุดเริ่มต้น',pages:['ประตูสู่โลกใบใหม่','เงาของราชัน','หมากตัวแรก','เรื่องราวกำลังจะเริ่มต้น']},{name:'ตอนที่ 2 — เส้นทางแห่งราชัน',pages:['การเดินทาง','พันธมิตรใหม่','ความลับที่ถูกซ่อน','โปรดติดตามตอนต่อไป']} ]},{id:'new',title:'มังงะเรื่องใหม่',genre:'แอ็กชัน · ผจญภัย',icon:'⚔️',desc:'พื้นที่สำหรับมังงะต้นฉบับเรื่องต่อไป',chapters:[]}];
let current={view:'home',book:null,chapter:0,page:0,mode:localStorage.getItem('mw_mode')||'scroll'};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cover(b){return `<div class="cover ${b.id==='new'?'alt':''}">${b.icon}<span>${b.chapters.length?'มีตอนสาธิต':'เร็ว ๆ นี้'}</span></div>`}function goHome(focus=false){current.view='home';render();if(focus)document.getElementById('library')?.scrollIntoView({behavior:'smooth'});else window.scrollTo(0,0)}function openBook(id){current.book=books.find(b=>b.id===id);current.view='detail';render();window.scrollTo(0,0)}function openChapter(i){if(!current.book?.chapters[i])return;current.chapter=i;current.page=0;try{let saved=JSON.parse(localStorage.getItem('mw_progress_'+current.book.id+'_'+i)||'null');if(saved&&Number.isInteger(saved.page))current.page=Math.max(0,Math.min(saved.page,current.book.chapters[i].pages.length-1))}catch(e){}current.view='reader';render();window.scrollTo(0,0)}function setMode(mode){current.mode=mode;localStorage.setItem('mw_mode',mode);render()}function saveProgress(){localStorage.setItem('mw_progress_'+current.book.id+'_'+current.chapter,JSON.stringify({page:current.page}))}function movePage(delta){let n=current.book.chapters[current.chapter].pages.length;current.page=Math.max(0,Math.min(n-1,current.page+delta));saveProgress();render();document.getElementById('art')?.scrollIntoView({behavior:'smooth',block:'start'})}function pageMarkup(label,i,n){return `<article class="page-art" aria-label="หน้าที่ ${i+1}"><div class="top">${esc(current.book.title)}</div><div class="scene"><span class="symbol">${current.book.icon}</span><div class="bubble">${esc(label)}</div></div><div class="bottom"><span>ภาพสาธิต — ยังไม่ใช่ภาพมังงะจริง</span><span>${i+1} / ${n}</span></div></article>`}function render(){if(current.view==='home'){app.innerHTML=`<section class="hero"><h1>เปิดประตูสู่โลกมังงะ</h1><p>รวมเรื่องราวหลากหลายแนวไว้ในเว็บไซต์เดียว</p><button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">สำรวจมังงะ</button></section><section id="library"><h2>มังงะทั้งหมด</h2><input class="search" id="search" placeholder="ค้นหาชื่อมังงะ..." aria-label="ค้นหามังงะ" oninput="filterBooks(this.value)"><div class="grid" id="bookGrid">${books.map(b=>`<button class="card" data-search="${esc((b.title+' '+b.genre).toLowerCase())}" onclick="openBook('${b.id}')">${cover(b)}<div class="card-info"><b>${esc(b.title)}</b><small>${esc(b.genre)}</small></div></button>`).join('')}</div><p class="empty hide" id="noBooks">ไม่พบมังงะที่ค้นหา</p></section><div class="ad">พื้นที่สำหรับโฆษณาในอนาคต — ยังไม่มีโฆษณาจริง</div><p class="muted">หมายเหตุ: เนื้อหาและภาพในเว็บตอนนี้เป็นตัวอย่างสำหรับทดสอบระบบ</p>`;return}let b=current.book;if(current.view==='detail'){app.innerHTML=`<button class="ghost back" onclick="goHome()">← กลับหน้าแรก</button><section class="detail">${cover(b)}<div><h1>${esc(b.title)}</h1><p class="muted">${esc(b.genre)}</p><p>${esc(b.desc)}</p><p>${b.chapters.length} ตอน</p>${b.chapters.length?'<button onclick="openChapter(0)">เริ่มอ่านตอนที่ 1</button>':''}</div></section><section class="chapters"><h2>รายชื่อตอน</h2>${b.chapters.length?b.chapters.map((c,i)=>`<button class="chapter" onclick="openChapter(${i})"><span>${esc(c.name)}</span><span>อ่าน ›</span></button>`).join(''):'<p class="notice">เรื่องนี้ยังไม่มีตอนให้อ่าน</p>'}</section>`;return}let c=b.chapters[current.chapter],n=c.pages.length;app.innerHTML=`<button class="ghost back" onclick="openBook('${b.id}')">← กลับรายชื่อตอน</button><div class="reader-head"><h1>${esc(b.title)} · ${esc(c.name)}</h1><span class="muted">${n} หน้า</span></div><div class="notice">ภาพในตอนนี้เป็นหน้าตัวอย่างเพื่อทดสอบระบบอ่าน ยังไม่ใช่มังงะที่วาดเสร็จแล้ว</div><div class="reader-controls"><button class="${current.mode==='scroll'?'active':''}" onclick="setMode('scroll')">↕ เลื่อนอ่าน</button><button class="${current.mode==='page'?'active':''}" onclick="setMode('page')">⇦ เปลี่ยนหน้า (ขวาไปซ้าย)</button></div><div id="art">${current.mode==='scroll'?c.pages.map((p,i)=>pageMarkup(p,i,n)).join(''):pageMarkup(c.pages[current.page],current.page,n)}</div>${current.mode==='page'?`<div class="page-nav"><button class="secondary" onclick="movePage(-1)" ${current.page===0?'disabled':''}>หน้าก่อนหน้า →</button><button onclick="movePage(1)" ${current.page===n-1?'disabled':''}>← หน้าถัดไป</button></div><p class="muted" style="text-align:center">หน้า ${current.page+1} จาก ${n} · จำหน้าที่อ่านค้างไว้ในเครื่องนี้</p>`:''}<div class="page-nav"><button class="secondary" onclick="openBook('${b.id}')">รายชื่อตอน</button><button onclick="nextChapter()" ${current.chapter+1>=b.chapters.length?'disabled':''}>ตอนถัดไป →</button></div>`}function filterBooks(q){let count=0;document.querySelectorAll('.card').forEach(el=>{let ok=el.dataset.search.includes(q.trim().toLowerCase());el.classList.toggle('hide',!ok);if(ok)count++});document.getElementById('noBooks').classList.toggle('hide',count!==0)}function nextChapter(){if(current.chapter+1<current.book.chapters.length)openChapter(current.chapter+1)}render();
</script></body></html>
