<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080e1c"><meta name="description" content="MANGA WORLD — โลกแห่งมังงะต้นฉบับ อ่านมังงะแฟนตาซีออนไลน์"><title>MANGA WORLD | โลกแห่งมังงะ</title>
<style>
:root{color-scheme:dark;--bg:#080e1c;--surface:#111f34;--line:#344d68;--gold:#a8d7ff;--gold2:#6095cc;--text:#f0f7ff;--muted:#a9bbd1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;background:radial-gradient(ellipse 90% 450px at 50% 0%,#213e60 0%,transparent 82%),var(--bg);min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:#0b1425ed;backdrop-filter:blur(18px);border-bottom:1px solid #698eb555;box-shadow:0 12px 32px #0005}header .inner{max-width:1190px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px}.logo{color:#d9edff;font:900 clamp(19px,3vw,26px) Georgia,serif;letter-spacing:1.7px;white-space:nowrap;text-shadow:0 0 20px #80bdff33}.logo:before{content:'✦';font-size:.75em;margin-right:9px}header nav{display:flex;gap:8px}button,.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:750;background:linear-gradient(115deg,#d8edff,#83baff);color:#10213a;transition:transform .2s,box-shadow .2s,border-color .2s}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 9px 22px #0007}.secondary{background:#1a2c44;color:#e3f1ff;border:1px solid #466582}.ghost{background:transparent;color:#c9e8ff;border:1px solid #6c9cca}
main{max-width:1150px;margin:auto;padding:26px 18px 75px}.hero{position:relative;isolation:isolate;overflow:hidden;min-height:335px;border:1px solid #80b9ed66;border-radius:24px;padding:clamp(30px,6vw,70px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 82% 40%,#467eae66,transparent 36%),linear-gradient(115deg,#0e1c30,#1b3450 65%,#0b1526);box-shadow:0 22px 65px #0008,inset 0 0 65px #91caff13;margin-bottom:36px}.hero:before{content:'ORIGINAL MANGA COLLECTION';font-size:11px;font-weight:850;letter-spacing:3px;color:var(--gold);margin-bottom:17px}.hero:after{content:'✧';position:absolute;right:7%;top:1%;font:300 clamp(160px,27vw,330px) Georgia,serif;color:#a7daff1b;z-index:-1}.hero h1{font:800 clamp(31px,5vw,51px)/1.25 Georgia,'Noto Serif Thai',serif;margin:0 0 14px;max-width:710px;text-shadow:0 4px 25px #0008}.hero p{max-width:550px;line-height:1.85;color:#c7d9ea;margin:0 0 22px}.hero button{padding:13px 26px}h2{font:750 clamp(23px,3vw,30px) Georgia,'Noto Serif Thai',serif;margin:0 0 19px}.section-heading:before{content:'✦';color:var(--gold);margin-right:11px}.muted,small{color:var(--muted)}.search{width:100%;padding:16px 18px;background:#101c2f;color:white;border:1px solid #405f7f;border-radius:13px;margin:0 0 24px;box-shadow:inset 0 1px 12px #0004}.search:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:22px}.card{padding:0;text-align:left;background:#122037;border:1px solid #37536e;color:white;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px #0005;transition:transform .22s,border-color .22s,box-shadow .22s}.card:hover{transform:translateY(-6px)!important;border-color:var(--gold);box-shadow:0 17px 38px #0009}.cover{aspect-ratio:3/4;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 58% 25%,#85546e80,transparent 47%),linear-gradient(145deg,#29476a,#101d33);font-size:82px;overflow:hidden}.cover.alt{background:radial-gradient(circle at 55% 22%,#5b8b9777,transparent 48%),linear-gradient(140deg,#263e4d,#26182f)}.cover:after{content:'';position:absolute;inset:9px;border:1px solid #e9c88b55;pointer-events:none}.cover span{position:absolute;bottom:15px;left:14px;z-index:1;font-size:12px;background:#080e1cd9;color:#d0eaff;border:1px solid #89b9e055;padding:5px 9px;border-radius:7px}.card-info{padding:15px}.card-info b{display:block;margin-bottom:6px;font-size:16px;line-height:1.5}.card-info small{line-height:1.6}.back{margin-bottom:22px}.detail{display:grid;grid-template-columns:minmax(130px,240px) 1fr;gap:26px;align-items:start}.detail .cover{border-radius:16px;box-shadow:0 16px 40px #0008}.detail h1{font:800 clamp(23px,3vw,38px) Georgia,'Noto Serif Thai',serif;color:#d0eaff;margin:0 0 12px}.detail p{line-height:1.8}.chapters{margin-top:35px}.chapter{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;padding:17px 19px;margin:10px 0;border:1px solid #385573;border-radius:12px;background:#132239;color:var(--text)}.chapter:hover{border-color:var(--gold);background:#203957}.reader-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.reader-head h1{font-size:clamp(18px,3vw,24px);margin:0}.reader-controls{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.reader-controls button{flex:1;min-width:130px}.reader-controls button.active{background:linear-gradient(115deg,#d8edff,#83baff);color:#10213a}.reader-controls button:not(.active){background:#1b304c;color:#deeeff}.page-art{background:white;color:#16141c;max-width:720px;margin:12px auto;min-height:420px;aspect-ratio:3/4;position:relative;overflow:hidden;border-radius:3px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-shadow:0 8px 24px #0007}.page-art .top{font-size:clamp(18px,4vw,31px);font-weight:900;border-bottom:5px solid #17141c;padding-bottom:10px}.page-art .scene{flex:1;margin:16px 0;border:5px solid #171720;background:repeating-linear-gradient(130deg,#f3f3f3,#f3f3f3 12px,#e7e7e7 13px,#e7e7e7 15px);display:grid;place-items:center;position:relative}.scene .symbol{font-size:clamp(75px,23vw,155px);filter:grayscale(1)}.bubble{background:white;border:3px solid #111;border-radius:50%;padding:12px 18px;text-align:center;max-width:85%;font-size:clamp(14px,3vw,20px);font-weight:700}.page-art .bottom{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.page-nav{display:flex;gap:10px;justify-content:center;margin:18px auto;max-width:720px}.page-nav button{flex:1}.notice{background:#1c304b;border-left:3px solid var(--gold);padding:13px;border-radius:6px;margin:15px 0}.ad{border:1px dashed #3d5b7a;border-radius:12px;color:var(--muted);text-align:center;padding:23px;margin:35px 0;background:#0e1a2b}.empty{padding:28px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:30px 16px;border-top:1px solid #304963;background:#070e1b}
@media(max-width:600px){header .inner{padding:12px}.logo{letter-spacing:.3px}.logo:before{margin-right:4px}header nav{gap:5px}header nav button{padding:8px;font-size:12px}main{padding:18px 12px 55px}.hero{min-height:280px;padding:28px 22px;margin-bottom:29px}.hero:after{right:-7%;top:19%;font-size:180px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{font-size:67px}.card-info{padding:11px}.detail{grid-template-columns:120px 1fr;gap:14px}.page-art{padding:13px;min-height:350px}.page-art .scene{margin:12px 0}.page-art .bottom{font-size:10px}}@media(max-width:360px){.logo{font-size:16px}header nav button{font-size:11px;padding:7px}.detail{grid-template-columns:100px 1fr}}

/* Navigation and browsing */
a{color:inherit}a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.logo{text-decoration:none}.menu-toggle{display:none}.primary-nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:10px 13px;white-space:nowrap}.primary-nav button[aria-current="page"]{background:#a8d7ff15;border-color:#7eb4df77;color:#d9edff}.primary-nav button:hover{color:var(--text)}.nav-icon{margin-right:6px}.page-intro{margin:12px 0 26px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase}.page-intro h1{font-size:clamp(28px,5vw,40px);margin:10px 0}.page-intro p{color:var(--muted);line-height:1.8}.browse-tools{display:flex;gap:12px;align-items:center;margin-bottom:18px}.browse-tools .search{margin:0;flex:1;min-width:0}.genre-select{padding:15px 12px;border-radius:12px;border:1px solid #405f7f;background:#101c2f;color:var(--text);max-width:45%}.library-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.library-heading small{white-space:nowrap}.section-note{color:var(--muted);line-height:1.8;margin-top:-7px;margin-bottom:22px}.reading-list,.episode-list{display:grid;gap:14px}.episode-row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:20px;background:var(--surface);border:1px solid var(--line);color:var(--text)}.episode-row b,.episode-row small{display:block;line-height:1.7}.episode-row small{font-weight:400;margin-top:3px}.episode-row .arrow{color:var(--gold);flex-shrink:0}.reading-card{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.reading-card .cover{border-radius:9px;font-size:38px}.reading-card .cover span{display:none}.reading-card h2{font-family:inherit;font-size:18px;margin:0 0 6px}.reading-card p{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 12px}.empty-state{text-align:center;border:1px dashed var(--line);border-radius:20px;padding:50px 22px;background:#111f3466}.empty-state .empty-icon{font-size:36px;color:var(--gold)}.empty-state h2{margin:18px 0 10px;font-family:inherit;font-size:22px}.empty-state p{color:var(--muted);line-height:1.8;margin-bottom:24px}.hero.image-theme{background-size:cover;background-position:center}.hero.image-theme:after{display:none}#library{scroll-margin-top:100px}.footer-brand{font-family:Georgia,serif;font-weight:900;letter-spacing:2px;color:var(--gold);margin-bottom:9px}.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin-bottom:18px}.footer-links button{border:0;background:none;padding:4px;color:var(--muted);font-size:14px;font-weight:500}.footer-links button:hover{color:var(--gold);box-shadow:none;transform:none}.footer-note{font-size:12px;line-height:1.8}
@media(max-width:700px){header .inner{flex-wrap:wrap;padding:12px 16px;gap:12px}.menu-toggle{display:block;padding:9px 12px}.primary-nav{display:none;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding-top:10px;border-top:1px solid #344d6866}.primary-nav.is-open{display:grid}.primary-nav button{text-align:left;padding:12px;font-size:14px}.browse-tools{flex-direction:column;align-items:stretch}.genre-select{max-width:100%;width:100%}.episode-row{padding:16px}.reading-card{grid-template-columns:75px 1fr;gap:13px;padding:14px}.library-heading h2{font-size:23px}.logo{font-size:21px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}


/* Original ice-dragon artwork, displayed in full without cropping. */
.hero.ice-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.72fr);gap:clamp(20px,4vw,54px);padding:32px 40px;min-height:550px;align-items:center;background:radial-gradient(ellipse at 85% 30%,#37699a55,transparent 65%),linear-gradient(120deg,#0d1b30,#172d47);border-color:#88b9e077}.hero.ice-hero:before,.hero.ice-hero:after{display:none}.hero-copy{min-width:0}.hero-kicker{display:block;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--gold);margin-bottom:22px}.ice-hero h1{font-size:clamp(32px,4vw,49px);line-height:1.35}.ice-hero p{font-size:15px;line-height:1.9;margin-bottom:26px}.hero-art{margin:0;justify-self:center;width:min(100%,334px);border-radius:18px;overflow:hidden;background:#595959;border:1px solid #adcff377;box-shadow:0 18px 45px #0006}.hero-art img{display:block;width:100%;height:auto;object-fit:contain}.primary-nav button[aria-current="page"]{color:#d9edff;background:#a8d7ff15;border-color:#7eb4df77}
@media(max-width:700px){.hero.ice-hero{grid-template-columns:minmax(0,1fr);padding:24px 20px;gap:26px;min-height:0}.hero-art{width:min(100%,260px);grid-row:1}.hero-copy{padding:0 2px 8px}.hero-kicker{margin-bottom:15px;font-size:10px;letter-spacing:1.6px}.ice-hero h1{font-size:32px}.ice-hero p{font-size:14px}.ice-hero button{width:100%}}

<link rel="stylesheet" href="manga-world-nightfall.css">
</head><body><header><div class="inner"><a class="logo" href="#home" onclick="event.preventDefault();goHome()" aria-label="MANGA WORLD หน้าแรก">MANGA WORLD</a><button class="secondary menu-toggle" id="menuToggle" aria-controls="primaryNav" aria-expanded="false" onclick="toggleMenu()">☰ เมนู</button><nav class="primary-nav" id="primaryNav" aria-label="เมนูหลัก"><button data-view="home" onclick="goHome()">หน้าแรก</button><button data-view="library" onclick="goHome(true)">มังงะทั้งหมด</button><button data-view="chapters" onclick="showSection('chapters')">รายการตอน</button><button data-view="continue" onclick="showSection('continue')">อ่านต่อ</button></nav></div></header><main id="app"></main><footer><div class="footer-brand">MANGA WORLD</div><div class="footer-links"><button onclick="goHome()">หน้าแรก</button><button onclick="goHome(true)">มังงะทั้งหมด</button><button onclick="showSection('chapters')">รายการตอน</button><button onclick="showSection('continue')">อ่านต่อ</button></div><div class="footer-note">© 2026 MANGA WORLD · มังงะต้นฉบับ</div></footer>
<script src="nameless-throne-book.js"></script>
<script src="hidden-sovereign-book.js"></script>
<script>

'use strict';
const books=[hiddenSovereign,namelessThrone,{id:'new',title:'มังงะเรื่องใหม่',genre:'แอ็กชัน · ผจญภัย',icon:'⚔️',desc:'พื้นที่สำหรับมังงะต้นฉบับเรื่องต่อไป',chapters:[]}];
// ใส่พาธภาพแบนเนอร์ที่อัปโหลดไว้ใน repository เพื่อเปลี่ยนธีมให้ทุกคนเห็น
const SITE_THEME={heroImage:''};
function readSaved(key,fallback=null){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(e){return fallback}}
function writeSaved(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
let current={view:'home',book:null,chapter:0,page:0,mode:(()=>{try{return localStorage.getItem('mw_mode')==='page'?'page':'scroll'}catch(e){return 'scroll'}})()};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cover(b){
  if(b.cover){
    return `<div class="cover book-cover" style="aspect-ratio:${b.coverWidth||1152}/${b.coverHeight||1536}"><img src="${esc(b.cover)}" alt="ปกเล่ม 1 ของ ${esc(b.title)}" width="${b.coverWidth||1152}" height="${b.coverHeight||1536}" decoding="async"></div>`;
  }
  return `<div class="cover alt">${b.icon}<span>เร็ว ๆ นี้</span></div>`;
}
function toggleMenu(){const open=document.getElementById('primaryNav').classList.toggle('is-open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(open))}
function syncNav(){document.getElementById('primaryNav').classList.remove('is-open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');document.querySelectorAll('[data-view]').forEach(el=>{const active=el.dataset.view===current.view;if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('primaryNav').classList.remove('is-open');document.getElementById('menuToggle').setAttribute('aria-expanded','false')}});
function goHome(library=false){showSection(library?'library':'home')}
function showSection(view){current.view=view;const route=view==='detail'?'#book/'+current.book.id:view==='reader'?'#read/'+current.book.id+'/'+(current.chapter+1):'#'+view;if(location.hash!==route)history.pushState(null,'',route);render();window.scrollTo(0,0)}
function openBook(id){const book=books.find(b=>b.id===id);if(!book)return;current.book=book;showSection('detail')}
function openChapter(i){if(!current.book?.chapters[i])return;current.chapter=i;current.page=0;const saved=readSaved('mw_progress_'+current.book.id+'_'+i);if(saved&&Number.isInteger(saved.page))current.page=Math.max(0,Math.min(saved.page,current.book.chapters[i].pages.length-1));saveProgress();showSection('reader')}
function setMode(mode){current.mode=mode;try{localStorage.setItem('mw_mode',mode)}catch(e){}render()}
function saveProgress(){if(!current.book)return;writeSaved('mw_progress_'+current.book.id+'_'+current.chapter,{page:current.page});let history=readSaved('mw_history',[]);if(!Array.isArray(history))history=[];history=history.filter(x=>x&&x.bookId!==current.book.id);history.unshift({bookId:current.book.id,chapter:current.chapter,page:current.page,updatedAt:Date.now()});writeSaved('mw_history',history.slice(0,30))}
function movePage(delta){const n=current.book.chapters[current.chapter].pages.length;current.page=Math.max(0,Math.min(n-1,current.page+delta));saveProgress();render();document.getElementById('art')?.scrollIntoView({behavior:'smooth',block:'start'})}
function pageMarkup(page,i,n){
  return `<figure class="manga-page"><img src="${esc(page.src)}" width="${page.width}" height="${page.height}" alt="หน้า ${i+1} — ${esc(page.alt)}" decoding="async"><figcaption>หน้า ${i+1} / ${n}</figcaption></figure>`;
}
function libraryMarkup(){return `<section id="library"><div class="library-heading"><h2 class="section-heading">มังงะทั้งหมด</h2><small id="resultCount" role="status">${books.length} เรื่อง</small></div><div class="browse-tools"><input class="search" id="search" placeholder="ค้นหาชื่อมังงะหรือแนวเรื่อง..." aria-label="ค้นหามังงะ" oninput="filterBooks()"><select class="genre-select" id="genre" aria-label="เลือกหมวดหมู่" onchange="filterBooks()"><option value="">ทุกหมวดหมู่</option><option value="แฟนตาซี">แฟนตาซี</option><option value="การเมือง">การเมือง</option><option value="แอ็กชัน">แอ็กชัน</option><option value="ผจญภัย">ผจญภัย</option></select></div><div class="grid" id="bookGrid">${books.map(b=>`<button class="card" data-search="${esc([b.title,b.thaiTitle,b.genre].filter(Boolean).join(' ').toLowerCase())}" data-genre="${esc(b.genre)}" onclick="openBook('${b.id}')">${cover(b)}<div class="card-info"><b>${esc(b.title)}</b>${b.thaiTitle?`<span class="book-subtitle">${esc(b.thaiTitle)}</span>`:''}<small>${esc(b.genre)}</small></div></button>`).join('')}</div><p class="empty hide" id="noBooks" role="status">ไม่พบมังงะที่ตรงกับการค้นหา ลองเปลี่ยนคำค้นหรือหมวดหมู่</p></section>`}
function intro(label,title,desc){return `<div class="page-intro"><span class="eyebrow">${label}</span><h1>${title}</h1><p>${desc}</p></div>`}
function applyHeroTheme(){if(!SITE_THEME.heroImage)return;try{const url=new URL(SITE_THEME.heroImage,location.href);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)return;const hero=document.querySelector('.hero');if(hero){hero.classList.add('image-theme');hero.style.backgroundImage='linear-gradient(90deg,rgba(11,9,20,.95),rgba(11,9,20,.5)),url('+JSON.stringify(url.href)+')'}}catch(e){}}
function render(){syncNav();
if(current.view==='home'){app.innerHTML=`<section class="hero ice-hero"><div class="hero-copy"><span class="hero-kicker">MANGA WORLD · ORIGINAL FANTASY</span><h1>เปิดประตูสู่<br>โลกแห่งจินตนาการ</h1><p>สัมผัสเรื่องราวแฟนตาซี ตำนานเทพมังกร และการผจญภัยเหนือจินตนาการ ในโลกแห่งมังงะต้นฉบับ</p><button onclick="goHome(true)">สำรวจมังงะ →</button></div><figure class="hero-art"><img src="ice-dragon-theme.png" alt="ตัวละครหญิงผมเงินในชุดสีขาว พร้อมปีกมังกรสีฟ้าน้ำแข็ง" width="1025" height="1536" fetchpriority="high" decoding="async"></figure></section>${libraryMarkup()}`;applyHeroTheme();return}
if(current.view==='library'){app.innerHTML=intro('MANGA COLLECTION','ค้นพบเรื่องราวที่คุณชอบ','เลือกมังงะจากชื่อเรื่องหรือหมวดหมู่ แล้วเปิดดูรายชื่อตอนเพื่อเริ่มอ่าน')+libraryMarkup();return}
if(current.view==='chapters'){app.innerHTML=intro('CHAPTER DIRECTORY','รายการตอน','รวมตอนที่เปิดให้อ่าน แยกตามเรื่อง')+`<div class="episode-list">${books.filter(b=>b.chapters.length).map(b=>`<section><h2 class="section-heading">${esc(b.title)}</h2>${b.chapters.map((c,i)=>`<button class="episode-row" onclick="openBook('${b.id}');openChapter(${i})"><span><b>${esc(c.name)}</b><small>${c.pages.length} หน้า</small></span><span class="arrow">อ่าน ›</span></button>`).join('')}</section>`).join('')||'<p class="empty">ยังไม่มีตอนให้อ่าน</p>'}</div>`;return}
if(current.view==='continue'){let history=readSaved('mw_history',[]);if(!Array.isArray(history))history=[];const entries=history.filter(x=>x&&books.some(b=>b.id===x.bookId&&Number.isInteger(x.chapter)&&b.chapters[x.chapter]));app.innerHTML=intro('YOUR READING','อ่านต่อจากครั้งก่อน','ประวัติการอ่านบันทึกไว้ในเบราว์เซอร์และอุปกรณ์นี้')+(entries.length?`<div class="reading-list">${entries.map(x=>{const b=books.find(b=>b.id===x.bookId),c=b.chapters[x.chapter];return `<article class="reading-card">${cover(b)}<div><h2>${esc(b.title)}</h2><p>${esc(c.name)}<br>เปิดอ่านล่าสุด${current.mode==='page'?' · หน้า '+(Math.max(0,Math.min(Number(x.page)||0,c.pages.length-1))+1):''}</p><button onclick="openBook('${b.id}');openChapter(${x.chapter})">อ่านต่อ →</button></div></article>`}).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">◇</div><h2>เริ่มเรื่องแรกของคุณ</h2><p>เมื่อเปิดอ่านมังงะ เรื่องที่อ่านจะปรากฏที่นี่<br>เพื่อกลับมาอ่านต่อได้สะดวก</p><button onclick="goHome(true)">เลือกมังงะให้อ่าน</button></div>`);return}
let b=current.book;if(current.view==='detail'){app.innerHTML=`<button class="ghost back" onclick="goHome()">← กลับหน้าแรก</button><section class="detail">${cover(b)}<div><h1>${esc(b.title)}</h1>${b.thaiTitle?`<p class="detail-subtitle">${esc(b.thaiTitle)}</p>`: ''}<p class="muted">${esc(b.genre)}</p><p>${esc(b.desc)}</p><p>${b.chapters.length} ตอน</p>${b.chapters.length?'<button onclick="openChapter(0)">เริ่มอ่านตอนที่ 1</button>':''}</div></section><section class="chapters"><h2 class="section-heading">รายชื่อตอน</h2>${b.chapters.length?b.chapters.map((c,i)=>`<button class="chapter" onclick="openChapter(${i})"><span>${esc(c.name)}</span><span>อ่าน ›</span></button>`).join(''):'<p class="notice">เรื่องนี้ยังไม่มีตอนให้อ่าน</p>'}</section>`;return}let c=b.chapters[current.chapter],n=c.pages.length;app.innerHTML=`<button class="ghost back" onclick="openBook('${b.id}')">← กลับรายชื่อตอน</button><div class="reader-head"><h1>${esc(b.title)} · ${esc(c.name)}</h1><span class="muted">${n} หน้า</span></div><div class="reader-controls"><button class="${current.mode==='scroll'?'active':''}" onclick="setMode('scroll')">↕ เลื่อนอ่าน</button><button class="${current.mode==='page'?'active':''}" onclick="setMode('page')">อ่านทีละหน้า</button></div><div id="art">${current.mode==='scroll'?c.pages.map((p,i)=>pageMarkup(p,i,n)).join(''):pageMarkup(c.pages[current.page],current.page,n)}</div>${current.mode==='page'?`<div class="page-nav"><button class="secondary" onclick="movePage(-1)" ${current.page===0?'disabled':''}>หน้าก่อนหน้า →</button><button onclick="movePage(1)" ${current.page===n-1?'disabled':''}>← หน้าถัดไป</button></div><p class="muted" style="text-align:center">หน้า ${current.page+1} จาก ${n} · จำหน้าที่อ่านค้างไว้ในเครื่องนี้</p>`:''}<div class="page-nav"><button class="secondary" onclick="openBook('${b.id}')">รายชื่อตอน</button><button onclick="nextChapter()" ${current.chapter+1>=b.chapters.length?'disabled':''}>ตอนถัดไป →</button></div>`}
function filterBooks(){const q=document.getElementById('search').value.trim().toLowerCase(),genre=document.getElementById('genre').value;let count=0;document.querySelectorAll('.card').forEach(el=>{const ok=el.dataset.search.includes(q)&&el.dataset.genre.includes(genre);el.classList.toggle('hide',!ok);if(ok)count++});document.getElementById('noBooks').classList.toggle('hide',count!==0);document.getElementById('resultCount').textContent=count+' เรื่อง'}
function nextChapter(){if(current.chapter+1<current.book.chapters.length)openChapter(current.chapter+1)}
function restoreRoute(){
const parts=location.hash.slice(1).split('/');
if(parts[0]==='book'||parts[0]==='read'){
 const book=books.find(b=>b.id===parts[1]);
 if(book){current.book=book;if(parts[0]==='read'&&/^\d+$/.test(parts[2]||'')&&book.chapters[Number(parts[2])-1]){openChapter(Number(parts[2])-1);return}showSection('detail');return}
}
showSection(['home','library','chapters','continue'].includes(parts[0])?parts[0]:'home');
}
window.addEventListener('popstate',restoreRoute);
window.addEventListener('hashchange',restoreRoute);
restoreRoute();
</script></body></html>
