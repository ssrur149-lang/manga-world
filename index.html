<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11121b"><meta name="description" content="MANGA WORLD เว็บไซต์อ่านมังงะต้นฉบับ">
<title>MANGA WORLD — อ่านมังงะ</title>
<style>
:root{color-scheme:dark;--bg:#101118;--surface:#1b1d29;--line:#303343;--text:#f7f7fa;--muted:#a6aabc;--accent:#ff527d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:#171923ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.bar{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;color:var(--accent);letter-spacing:.5px;font-size:20px}.links{display:flex;gap:15px}.links button{background:none;border:0;color:var(--text);font-size:14px}.wrap{max-width:1100px;margin:auto;padding:0 18px}.hero{background:linear-gradient(130deg,#48233c,#17192b 72%);padding:54px 0}.hero h1{font-size:clamp(27px,6vw,42px);margin:0 0 8px}.hero p{color:#d5cbd6}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#ffffff18;color:#f9bfd0;font-size:12px}.action{background:var(--accent);border:0;color:#160b13;font-weight:800;padding:12px 18px;border-radius:10px}.section{padding-top:26px;padding-bottom:28px}.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;color:var(--text);outline:none}.search:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.comic{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;color:inherit;padding:0;width:100%;transition:transform .15s}.comic:active{transform:scale(.98)}.cover{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:68px;background:linear-gradient(140deg,#58304e,#20263d)}.cover.second{background:linear-gradient(140deg,#23394e,#3b2542)}.comic .meta{padding:12px}.comic h3{margin:0 0 5px;font-size:16px}.muted{color:var(--muted);font-size:13px}.ad{border:1px dashed #565a6c;border-radius:12px;text-align:center;padding:22px;color:var(--muted);font-size:13px;margin:10px 0 26px}.hidden{display:none!important}.back{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:9px}.chapter{display:block;width:100%;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-align:left}.reader{max-width:780px;margin:20px auto}.page{background:#f5f1e9;color:#23202b;min-height:450px;margin:0 auto 12px;padding:40px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px}.page strong{font-size:26px}.page p{line-height:1.8}.reader img{display:block;width:100%;height:auto}footer{border-top:1px solid var(--line);padding:26px 18px;color:var(--muted);text-align:center;font-size:12px}@media(max-width:480px){.links{gap:6px}.links button{font-size:12px}.logo{font-size:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:40px 0}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">MANGA WORLD</div><nav class="links"><button onclick="home()">หน้าแรก</button><button onclick="home();document.getElementById('library').scrollIntoView()">มังงะทั้งหมด</button></nav></div></header>
<main id="homeView"><section class="hero"><div class="wrap"><span class="pill">มังงะต้นฉบับ • อ่านบนมือถือ</span><h1>เปิดประตูสู่โลกมังงะ</h1><p>รวมเรื่องราวหลากหลายแนวไว้ในเว็บไซต์เดียว</p><button class="action" onclick="document.getElementById('library').scrollIntoView()">สำรวจมังงะ</button></div></section><div class="wrap section" id="library"><h2>มังงะทั้งหมด</h2><input class="search" id="search" placeholder="ค้นหาชื่อมังงะ..." aria-label="ค้นหามังงะ" oninput="filterManga()"><p id="empty" class="muted hidden">ไม่พบมังงะที่ค้นหา</p><div class="grid" id="grid" style="margin-top:20px"></div></div><div class="wrap"><div class="ad">พื้นที่โฆษณาในอนาคต — ยังไม่มีโฆษณาจริง</div></div></main>
<main id="detailView" class="wrap section hidden"><button class="back" onclick="home()">← กลับหน้าหลัก</button><h1 id="detailTitle"></h1><p class="muted" id="detailDesc"></p><h2>รายชื่อตอน</h2><div id="chapterList"></div></main>
<main id="readerView" class="wrap section hidden"><button class="back" onclick="openComic(currentComic)">← กลับไปรายชื่อตอน</button><h1 id="readerTitle"></h1><div class="reader" id="readerPages"></div><button class="back" onclick="openComic(currentComic)">อ่านจบแล้ว • กลับไปรายชื่อตอน</button></main>
<footer>© 2026 MANGA WORLD • เว็บไซต์ต้นแบบมังงะต้นฉบับ</footer>
<script>
// เพิ่มเรื่องใหม่และตอนใหม่ได้ที่รายการนี้ในอนาคต
const manga=[
{id:'nameless',title:'ราชันไร้นาม',genre:'แฟนตาซี • การเมือง',emoji:'👑',description:'เรื่องต้นฉบับแนวแฟนตาซี เตรียมเปิดตัว',chapters:[]},
{id:'new',title:'มังงะเรื่องใหม่',genre:'เร็ว ๆ นี้',emoji:'⚔️',description:'พื้นที่สำหรับมังงะเรื่องต่อไป',chapters:[]}
];
let currentComic=null;
function show(view){for(const id of ['homeView','detailView','readerView'])document.getElementById(id).classList.toggle('hidden',id!==view);window.scrollTo(0,0)}
function home(){show('homeView')}
function filterManga(){let q=document.getElementById('search').value.trim().toLocaleLowerCase();let count=0;document.querySelectorAll('.comic').forEach(el=>{let match=el.dataset.title.toLocaleLowerCase().includes(q);el.classList.toggle('hidden',!match);if(match)count++});document.getElementById('empty').classList.toggle('hidden',count>0)}
function openComic(id){let comic=manga.find(m=>m.id===id);if(!comic)return;currentComic=id;document.getElementById('detailTitle').textContent=comic.title;document.getElementById('detailDesc').textContent=comic.description;let list=document.getElementById('chapterList');list.replaceChildren();if(!comic.chapters.length){let p=document.createElement('p');p.className='muted';p.textContent='ยังไม่มีตอนเผยแพร่ — เราจะเพิ่มภาพมังงะจริงในขั้นตอนถัดไป';list.append(p)}else comic.chapters.forEach((c,i)=>{let b=document.createElement('button');b.className='chapter';b.textContent=c.title;b.onclick=()=>openChapter(id,i);list.append(b)});show('detailView')}
function openChapter(id,i){let comic=manga.find(m=>m.id===id);let chapter=comic?.chapters[i];if(!chapter)return;document.getElementById('readerTitle').textContent=comic.title+' — '+chapter.title;let pages=document.getElementById('readerPages');pages.replaceChildren();for(let url of chapter.pages){let img=document.createElement('img');img.src=url;img.alt='หน้ามังงะ';img.loading='lazy';pages.append(img)}show('readerView')}
function init(){let grid=document.getElementById('grid');manga.forEach((m,i)=>{let btn=document.createElement('button');btn.className='comic';btn.dataset.title=m.title;let cover=document.createElement('div');cover.className='cover'+(i%2?' second':'');cover.textContent=m.emoji;let meta=document.createElement('div');meta.className='meta';let h=document.createElement('h3');h.textContent=m.title;let p=document.createElement('div');p.className='muted';p.textContent=m.genre;meta.append(h,p);btn.append(cover,meta);btn.onclick=()=>openComic(m.id);grid.append(btn)})}init();
</script>
</body></html>
